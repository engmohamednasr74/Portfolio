<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>3D Calculator Viewer</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #222;
        }

        model-viewer {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<model-viewer src="test22.glb" alt="الآلة الحاسبة 3D" ar ar-modes="webxr scene-viewer quick-look" camera-controls
    auto-rotate shadow-intensity="2.5" exposure="1.0"
    environment-image="neutral"
    tone-mapping="neutral" >

    <div class="progress-bar hide" slot="progress-bar">
        <div class="update-bar"></div>
    </div>
</model-viewer>


</body>

</html>
