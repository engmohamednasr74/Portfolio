    <main class="pt-28 pb-12 container mx-auto px-4">
        <div class="max-w-4xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">

            <div class="bg-white p-6 rounded-3xl shadow-sm border border-orange-50 order-2 lg:order-1">

                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold mb-2">الأسم</label>
                        <input type="text" id="customer-name"
                            class="w-full px-4 py-3 rounded-xl border border-gray-100 focus:border-orange-500 outline-none transition-all bg-gray-50"
                            placeholder="أدخل اسمك" required>
                        <p id="error-name" class="error-message italic">يرجى إدخال الاسم</p>
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">رقم التلفون</label>
                        <input type="tel" id="customer-phone"
                            class="w-full px-4 py-3 rounded-xl border border-gray-100 focus:border-orange-500 outline-none transition-all bg-gray-50"
                            placeholder="01xxxxxxxxx - 040xxxxxxx" required minlength="10" maxlength="13">
                        <p id="error-phone" class="error-message italic">يرجى إدخال رقم هاتف صحيح</p>
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">العنوان</label>

                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">ملحوظة</label>
                        <textarea id="customer-notes" rows="2"
                            class="w-full px-4 py-3 rounded-xl border border-gray-100 focus:border-orange-500 outline-none transition-all bg-gray-50"
                            placeholder="أي ملاحظات إضافية؟"></textarea>
                    </div>

                    <div class="mt-4 p-4 bg-orange-50 rounded-2xl border border-orange-100">

                        <div class="grid grid-cols-2 gap-3" id="phone-options">
                        </div>
                    </div>

                    <button onclick="sendOrder()"
                        class="w-full bg-green-700 hover:bg-green-800 text-white py-4 rounded-2xl font-bold text-lg shadow-lg transition-all flex items-center justify-center gap-2 mt-4">

                    <div class="flex justify-between text-xl font-black text-green-900 pt-2">

    <script src="js/menuData.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // كود تشغيل القائمة الجانبية (Sidebar Logic)
            const openBtn = document.getElementById('mobile-menu-open');
            const closeBtn = document.getElementById('mobile-menu-close');
            const sidebar = document.getElementById('mobile-sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const content = document.getElementById('sidebar-content');

            function toggleMenu(isOpen) {
                if (isOpen) {
                    sidebar.classList.remove('invisible');
                    overlay.classList.add('opacity-100');
                    content.classList.remove('translate-x-full');
                    document.body.style.overflow = 'hidden'; // منع السكرول عند فتح المنيو
                } else {
                    overlay.classList.remove('opacity-100');
                    content.classList.add('translate-x-full');
                    setTimeout(() => {
                        sidebar.classList.add('invisible');
                        document.body.style.overflow = '';
                    }, 300);
                }
            }

            if (openBtn) openBtn.addEventListener('click', () => toggleMenu(true));
            if (closeBtn) closeBtn.addEventListener('click', () => toggleMenu(false));
            if (overlay) overlay.addEventListener('click', () => toggleMenu(false));
        });

        // 1. جلب البيانات الأولية
        let cart = JSON.parse(localStorage.getItem('khtaam_cart')) || [];
        const selectedBranch = JSON.parse(localStorage.getItem('selectedBranch'));

        // التحقق إذا كانت السلة فارغة (توجيه للمنيو)
        if (cart.length === 0) {
            window.location.href = 'cart.html';
        }

        // التحقق من وجود فرع مختار
        if (!selectedBranch) {
            window.location.href = 'branches.html';
        }

        /**
         * تحديث عداد السلة في الهيدر (قراءة مباشرة من التخزين)
         */
        function updateCartCount() {
            const badge = document.getElementById('cart-count');
            if (badge) {
                const latestCart = JSON.parse(localStorage.getItem('khtaam_cart')) || [];
                const totalItems = latestCart.reduce((sum, item) => sum + item.quantity, 0);
                badge.innerText = totalItems;
                // إخفاء العداد إذا كان صفراً
                badge.style.display = totalItems > 0 ? 'flex' : 'none';
            }
        }

        /**
         * تحديد الشفت الحالي
         */
        function getActiveShift() {
            const now = new Date();
            const hour = now.getHours();
            const minute = now.getMinutes();

            if (hour >= 6 && hour < 16) return 'morning';
            else if (hour >= 16 || hour === 0 || (hour === 1 && minute < 30)) return 'evening';
            return 'closed';
        }

        /**
         * عرض المنتجات في ملخص الطلب
         */
        function renderItems() {
            const itemsContainer = document.getElementById('order-items');
            const currentCart = JSON.parse(localStorage.getItem('khtaam_cart')) || [];

            if (currentCart.length === 0) {
                itemsContainer.innerHTML = '<p class="text-center text-gray-400">السلة فارغة</p>';
                return;
            }

            itemsContainer.innerHTML = currentCart.map(item => `
                <div class="flex justify-between items-center">
                    <div class="text-right">
                        <h4 class="font-bold text-gray-800">${item.quantity} x ${item.name}</h4>
                    </div>
                </div>
            `).join('');
        }

        /**
         * تشغيل الصفحة
         */
        function initPage() {
            // تحديث بيانات الفرع
            document.getElementById('branch-name').innerText = selectedBranch.nameAr;
            document.getElementById('branch-address').innerText = selectedBranch.address;

            const shift = getActiveShift();
            const phoneContainer = document.getElementById('phone-options');
            phoneContainer.innerHTML = '';

            if (shift === 'closed') {
                phoneContainer.innerHTML = `<p class="col-span-2 text-red-600 font-bold text-center p-2">المطعم مغلق حالياً</p>`;
            } else if (selectedBranch.shifts && selectedBranch.shifts[shift]) {
                const availableNumbers = selectedBranch.shifts[shift];
                phoneContainer.innerHTML = availableNumbers.map((num, idx) => `
                    <label class="relative flex items-center justify-center p-3 border-2 border-gray-100 bg-white rounded-xl cursor-pointer hover:border-orange-500 transition-all has-[:checked]:border-green-600 has-[:checked]:bg-green-50">
                        <input type="radio" name="target_phone" value="${num}" ${idx === 0 ? 'checked' : ''} class="absolute opacity-0">
                        <div class="text-center">
                            <span class="block text-xs text-gray-500">مسؤول ${idx + 1}</span>
                            <span class="font-bold text-sm">${num}</span>
                        </div>
                    </label>
                `).join('');
            } else {
                phoneContainer.innerHTML = `<p class="col-span-2 text-gray-500 text-center p-2">لا توجد أرقام متاحة حالياً</p>`;
            }

            renderItems();
            updateCartCount();
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        /**
         * إرسال الطلب
         */
        function sendOrder() {
            const fields = [
                { id: 'customer-name', errorId: 'error-name' },
                { id: 'customer-phone', errorId: 'error-phone' },
                { id: 'customer-address', errorId: 'error-address' }
            ];

            let isValid = true;
            fields.forEach(field => {
                const input = document.getElementById(field.id);
                const errorText = document.getElementById(field.errorId);
                if (!input.value.trim()) {
                    input.classList.add('input-error');
                    errorText.style.display = 'block';
                    isValid = false;
                } else {
                    input.classList.remove('input-error');
                    errorText.style.display = 'none';
                }
            });

            if (!isValid) return;

            const selectedPhoneElement = document.querySelector('input[name="target_phone"]:checked');
            if (!selectedPhoneElement) {
                alert('الرجاء اختيار رقم الواتساب المتاح حالياً');
                return;
            }

            const currentCart = JSON.parse(localStorage.getItem('khtaam_cart')) || [];
            const name = document.getElementById('customer-name').value;
            const phone = document.getElementById('customer-phone').value;
            const address = document.getElementById('customer-address').value;
            const notes = document.getElementById('customer-notes').value || "لا يوجد ملحوظه";
            const targetWhatsApp = selectedPhoneElement.value.replace(/\D/g, '');

            let message = `Order ${selectedBranch.nameAr} \n\n`;
            currentCart.forEach(item => {
                message += ` ${item.quantity} x ${item.name}\n`;
            });
            message += `\n الأسم: ${name} \n`;
            message += `\n رقم العميل: ${phone} \n`;
            message += `\n العنوان: ${address} \n`;
            message += `\n ملحوظه: ${notes}`;

            window.open(`https://wa.me/${targetWhatsApp}?text=${encodeURIComponent(message)}`, '_blank');

            localStorage.removeItem('khtaam_cart');
            window.location.href = 'index.html';
        }

        // مراقب التغييرات في التخزين (لمزامنة العداد إذا عدل المستخدم السلة في تبويب آخر)
        window.addEventListener('storage', (event) => {
            if (event.key === 'khtaam_cart') {
                updateCartCount();
                renderItems();
                // إذا أصبحت السلة فارغة من تبويب آخر، ارجع للمنيو
                const checkCart = JSON.parse(event.newValue) || [];
                if (checkCart.length === 0) window.location.href = 'cart.html';
            }
        });

        document.addEventListener('DOMContentLoaded', initPage);
    </script>
