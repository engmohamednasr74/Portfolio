<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <title>عرض الآلة الحاسبة 3D مع Flip</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #222;
        }

        model-viewer {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>
    <model-viewer src="scene.glb" alt="الآلة الحاسبة 3D" ar ar-modes="webxr scene-viewer quick-look" camera-controls
        auto-rotate shadow-intensity="2.5" exposure="1.0" environment-image="neutral" tone-mapping="neutral"
        scale="1 -1 1">
        <div class="progress-bar hide" slot="progress-bar">
            <div class="update-bar"></div>
        </div>
    </model-viewer>
    <script>
    </script>
</body>

</html>
