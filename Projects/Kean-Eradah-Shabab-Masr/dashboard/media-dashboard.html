<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة البرامج الإعلامية - إرادة شباب مصر</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/text-css.css">
    <link rel="stylesheet" href="css/text-css2.css">
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
    <script src="js/Firebase.js"></script>
    <style>
        button[type="submit"] {
            background-color: #000;
        }

        input,
        textarea {
            color: #000;
        }
    </style>
</head>

<body class="min-h-screen bg-background">
    <header class="bg-card border-b border-golden/20 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-bold text-accent">إدارة البرامج الإعلامية</h1>
                <a href="dashboard.html" class="text-foreground/80 hover:text-accent">عودة إلى الداشبورد</a>
            </div>
        </div>
    </header>
    <main class="container mx-auto px-4 py-12">
        <!-- قسم تسجيل الدخول إذا مش أدمن -->
        <div id="login-section" class="text-center my-8">
            <button onclick="loginAsAdmin()"
                class="bg-green-600 text-white px-10 py-5 rounded-xl text-xl font-bold hover:bg-green-700 transition shadow-lg">
                تسجيل الدخول كأدمن
            </button>
        </div>

        <!-- محتوى الإدارة (مخفي إلا للأدمن) -->
        <div id="admin-content" class="hidden">
            <!-- نموذج إضافة/تعديل برنامج إعلامي -->
            <section class="mb-8">
                <h2 class="text-xl font-bold mb-4">إضافة/تعديل برنامج إعلامي</h2>
                <form id="media-form">
                    <input type="hidden" id="media-id"> <!-- لتخزين ID عند التعديل -->
                    <input type="text" id="media-title" placeholder="اسم البرنامج" class="border p-2 mb-2 w-full"
                        required>
                    <textarea id="media-desc" placeholder="وصف البرنامج" class="border p-2 mb-2 w-full"
                        required></textarea>
                    <input type="url" id="media-image" placeholder="رابط الصورة (اختياري)"
                        class="border p-2 mb-2 w-full">
                    <button type="submit" id="submit-btn"
                        class="bg-blue-600 text-white px-4 py-2 rounded">إضافة</button>
                    <button type="button" id="cancel-edit"
                        class="hidden bg-gray-600 text-white px-4 py-2 rounded ml-2">إلغاء</button>
                </form>
            </section>

            <!-- قائمة البرامج الإعلامية الحالية -->
            <section>
                <h2 class="text-xl font-bold mb-4">البرامج الإعلامية الحالية</h2>
                <table class="w-full border-collapse">
                    <thead>
                        <tr class="bg-muted">
                            <th class="p-2">الاسم</th>
                            <th class="p-2">الوصف</th>
                            <th class="p-2">الصورة</th>
                            <th class="p-2">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="media-list"></tbody>
                </table>
            </section>
        </div>
    </main>

    <script>
        // تحقق من حالة الأدمن (من Firebase.js)
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                loadMedia(); // جلب البيانات
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('admin-content').classList.add('hidden');
            }
        });

        // جلب البرامج الإعلامية
        function loadMedia() {
            getItems('media', (items) => {
                const list = document.getElementById('media-list');
                list.innerHTML = '';
                items.forEach(([id, item]) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="p-2">${item.title || ''}</td>
                        <td class="p-2">${item.desc || ''}</td>
                        <td class="p-2">${item.image ? '<img src="' + item.image + '" width="50">' : 'لا صورة'}</td>
                        <td class="p-2">
                            <button onclick="editMedia('${id}', '${item.title || ''}', '${item.desc || ''}', '${item.image || ''}')" class="bg-yellow-600 text-white px-2 py-1 rounded">تعديل</button>
                            <button onclick="deleteItem('media', '${id}')" class="bg-red-600 text-white px-2 py-1 rounded">حذف</button>
                        </td>
                    `;
                    list.appendChild(row);
                });
            });
        }

        // إضافة أو تعديل برنامج
        const form = document.getElementById('media-form');
        const submitBtn = document.getElementById('submit-btn');
        const cancelBtn = document.getElementById('cancel-edit');
        const idInput = document.getElementById('media-id');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const data = {
                title: document.getElementById('media-title').value,
                desc: document.getElementById('media-desc').value,
                image: document.getElementById('media-image').value
            };
            const mediaId = idInput.value;
            if (mediaId) {
                updateItem('media', mediaId, data);
            } else {
                addItem('media', data);
            }
            resetForm();
            loadMedia();
        });

        // تعديل برنامج: ملء الفورم وتغيير الزر
        function editMedia(id, title, desc, image) {
            idInput.value = id;
            document.getElementById('media-title').value = title;
            document.getElementById('media-desc').value = desc;
            document.getElementById('media-image').value = image;
            submitBtn.textContent = 'تحديث';
            cancelBtn.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // إلغاء التعديل وإعادة الفورم للإضافة
        cancelBtn.addEventListener('click', resetForm);

        function resetForm() {
            form.reset();
            idInput.value = '';
            submitBtn.textContent = 'إضافة';
            cancelBtn.classList.add('hidden');
        }
    </script>
</body>


</html>
