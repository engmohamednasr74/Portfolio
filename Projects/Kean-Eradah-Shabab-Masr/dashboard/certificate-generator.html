<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توليد الشهادات - إرادة شباب مصر</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/text-css.css">
    <link rel="stylesheet" href="css/text-css2.css">
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
    <script src="js/Firebase.js"></script>
    <!-- jsPDF لتوليد PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        button[type="submit"] {
            background-color: #000;
        }

        input,
        textarea {
            color: #000;
        }

        #loading {
            display: none;
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body class="min-h-screen bg-background">
    <header class="bg-card border-b border-golden/20 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-bold text-accent">توليد الشهادات</h1>
                <a href="training-dashboard.html" class="text-foreground/80 hover:text-accent">عودة إلى إدارة
                    التدريبات</a>
            </div>
        </div>
    </header>
    <main class="container mx-auto px-4 py-12">
        <!-- قسم تسجيل الدخول إذا مش أدمن -->
        <div id="login-section" class="text-center my-8">
            <button onclick="loginAsAdmin()"
                class="bg-green-600 text-white px-10 py-5 rounded-xl text-xl font-bold hover:bg-green-700 transition shadow-lg">
                تسجيل الدخول كأدمن
            </button>
        </div>

        <!-- محتوى التوليد (مخفي إلا للأدمن) -->
        <div id="admin-content" class="hidden">
            <h2 class="text-xl font-bold mb-4">توليد الشهادات للتدريب: <span id="training-title"></span></h2>
            <input type="hidden" id="training-id">
            <textarea id="attendees-names" placeholder="أدخل أسماء الحاضرين باللغه الانجليزيه(كل اسم في سطر جديد، مثل: Mohamed Nasr)"
                class="border p-2 mb-4 w-full" rows="10" required></textarea>
            <button onclick="generateCertificates()"
                class="bg-green-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-green-700 transition">توليد
                وتحميل الشهادات</button>
            <p id="loading" class="mt-4">جاري التوليد...</p>
            <p id="error-message" class="mt-4 text-red-600 hidden">خطأ: أدخل أسماء صحيحة!</p>
        </div>
    </main>

    <script>
        // تحقق من الأدمن
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                loadTrainingInfo(); // جلب معلومات التدريب من URL
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('admin-content').classList.add('hidden');
            }
        });

        // جلب ID واسم التدريب من URL
        function loadTrainingInfo() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const title = decodeURIComponent(params.get('title') || '');
            if (id && title) {
                document.getElementById('training-id').value = id;
                document.getElementById('training-title').textContent = title;
            } else {
                document.getElementById('admin-content').innerHTML = '<p class="text-red-600">خطأ: لم يتم العثور على التدريب!</p>';
            }
        }

        // توليد الشهادات بدون alert
        function generateCertificates() {
            const namesText = document.getElementById('attendees-names').value.trim();
            if (!namesText) {
                document.getElementById('error-message').classList.remove('hidden');
                return;
            }
            document.getElementById('error-message').classList.add('hidden');
            document.getElementById('loading').style.display = 'block';

            const names = namesText.split('\n').filter(name => name.trim());
            const { jsPDF } = window.jspdf;
            const templateUrl = 'https://i.postimg.cc/ZRdLwz8n/Whats-App-Image-2026-01-22-at-1-03-07-AM.jpg'; // غير برابط الشهادة الحقيقي

            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = templateUrl;
            img.onload = function () {
                names.forEach((name) => {
                    const pdf = new jsPDF('landscape', 'pt', 'a4');
                    pdf.addImage(img, 'PNG', 0, 0, 842, 595); // حجم A4
                    pdf.setFont("helvetica", "bold");
                    pdf.addFileToVFS('Amiri-Regular.ttf', 'الـ base64 بتاع الخط هنا'); // استخدم online converter لـ base64
                    pdf.addFont('Amiri-Regular.ttf', 'Amiri', 'normal');
                    pdf.setFont('Amiri');
                    pdf.setFontSize(24);
                    pdf.setTextColor(0, 0, 255); // لون أزرق زي الشهادة
                    pdf.text(name, 400, 270, { align: 'center' }); // مكان الاسم (عدل 421, 300 لو لازم)
                    pdf.save(`شهادة_${name}.pdf`); // تحميل تلقائي
                });
                document.getElementById('loading').style.display = 'none';
            };
            img.onerror = function () {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error-message').textContent = 'خطأ: مشكلة في تحميل الشهادة!';
                document.getElementById('error-message').classList.remove('hidden');
            };
        }
    </script>
</body>

</html>
