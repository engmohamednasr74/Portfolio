<body class="min-h-screen bg-background">
    <header class="bg-card border-b border-golden/20 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-bold text-accent">إدارة الفعاليات</h1>
                <a href="dashboard.html" class="text-foreground/80 hover:text-accent">عودة إلى الداشبورد</a>
            </div>
        </div>
    </header>
    <main class="container mx-auto px-4 py-12">
        <!-- قسم تسجيل الدخول إذا مش أدمن -->
        <div id="login-section" class="text-center my-8">
            <button onclick="loginAsAdmin()"
                class="bg-green-600 text-white px-10 py-5 rounded-xl text-xl font-bold hover:bg-green-700 transition shadow-lg">
                تسجيل الدخول كأدمن
            </button>
        </div>

        <!-- محتوى الإدارة (مخفي إلا للأدمن) -->
        <div id="admin-content" class="hidden">
            <!-- نموذج إضافة/تعديل فعالية -->
            <section class="mb-8">
                <h2 class="text-xl font-bold mb-4">إضافة/تعديل فعالية</h2>
                <form id="event-form">
                    <input type="hidden" id="event-id"> <!-- لتخزين ID عند التعديل -->
                    <input type="text" id="event-title" placeholder="عنوان الفعالية" class="border p-2 mb-2 w-full"
                        required>
                    <textarea id="event-desc" placeholder="وصف الفعالية" class="border p-2 mb-2 w-full"
                        required></textarea>
                    <input type="date" id="event-date" class="border p-2 mb-2 w-full" required>
                    <input type="url" id="event-image" placeholder="رابط الصورة (اختياري)"
                        class="border p-2 mb-2 w-full">
                    <button type="submit" id="submit-btn"
                        class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-secondary">إضافة</button>
                    <button type="button" id="cancel-edit"
                        class="hidden bg-gray-600 text-white px-4 py-2 rounded ml-2">إلغاء</button>
                </form>
            </section>

            <!-- قائمة الفعاليات الحالية -->
            <section>
                <h2 class="text-xl font-bold mb-4">الفعاليات الحالية</h2>
                <table class="w-full border-collapse">
                    <thead>
                        <tr class="bg-muted">
                            <th class="p-2">العنوان</th>
                            <th class="p-2">الوصف</th>
                            <th class="p-2">التاريخ</th>
                            <th class="p-2">الصورة</th>
                            <th class="p-2">إجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="events-list"></tbody>
                </table>
            </section>
        </div>
    </main>

    <script>
        // تحقق من حالة الأدمن (من Firebase.js)
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                loadEvents(); // جلب البيانات
            } else {
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('admin-content').classList.add('hidden');
            }
        });

        // جلب الفعاليات
        function loadEvents() {
            getItems('events', (items) => {
                const list = document.getElementById('events-list');
                list.innerHTML = '';
                items.forEach(([id, item]) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="p-2">${item.title || ''}</td>
                        <td class="p-2">${item.desc || ''}</td>
                        <td class="p-2">${item.date || ''}</td>
                        <td class="p-2">${item.image ? '<img src="' + item.image + '" width="50">' : 'لا صورة'}</td>
                        <td class="p-2">
                            <button onclick="editEvent('${id}', '${item.title || ''}', '${item.desc || ''}', '${item.date || ''}', '${item.image || ''}')" class="bg-yellow-600 text-white px-2 py-1 rounded">تعديل</button>
                            <button onclick="deleteItem('events', '${id}')" class="bg-red-600 text-white px-2 py-1 rounded">حذف</button>
                        </td>
                    `;
                    list.appendChild(row);
                });
            });
        }

        // إضافة أو تعديل فعالية
        const form = document.getElementById('event-form');
        const submitBtn = document.getElementById('submit-btn');
        const cancelBtn = document.getElementById('cancel-edit');
        const idInput = document.getElementById('event-id');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const data = {
                title: document.getElementById('event-title').value,
                desc: document.getElementById('event-desc').value,
                date: document.getElementById('event-date').value,
                image: document.getElementById('event-image').value
            };
            const eventId = idInput.value;
            if (eventId) {
                updateItem('events', eventId, data);
            } else {
                addItem('events', data);
            }
            resetForm();
            loadEvents();
        });

        // تعديل فعالية: ملء الفورم وتغيير الزر
        function editEvent(id, title, desc, date, image) {
            idInput.value = id;
            document.getElementById('event-title').value = title;
            document.getElementById('event-desc').value = desc;
            document.getElementById('event-date').value = date;
            document.getElementById('event-image').value = image;
            submitBtn.textContent = 'تحديث';
            cancelBtn.classList.remove('hidden');
            // انتقل إلى أعلى الصفحة
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // إلغاء التعديل وإعادة الفورم للإضافة
        cancelBtn.addEventListener('click', resetForm);

        function resetForm() {
            form.reset();
            idInput.value = '';
            submitBtn.textContent = 'إضافة';
            cancelBtn.classList.add('hidden');
        }
    </script>
</body>
